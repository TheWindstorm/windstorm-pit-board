name: tests
on:
  push:
    branches: [main, "release-*"]
  pull_request:
permissions:
  contents: read
# Family rule 17 (2026-11-23): GitHub gives the account a few Mac runners for all its repositories together. A newer
# push to a pull request cancels that pull request's older runs; a push to main or a release branch is never cancelled
# (each push is its own group).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-push-{1}', github.workflow, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Every run step uses bash with pipefail, so a command piped into another can never hide a failure.
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # G20.8 (plan 1.29): each job names its runner image, never latest. setup-python builds 3.9 for Ubuntu 24.04,
        # not 26.04.
        os: [ubuntu-24.04]
        python: ["3.9", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # G20.6 (plan 1.22): -v gives every test its own line with its outcome and a skip's reason, so the log shows
      # each test ran. Never with -q (it cancels -v); -rA is not enough (it folds skips into one line without names).
      # pytest drops a skip's reason that does not fit the terminal (80 columns on CI, and some test IDs are long):
      # COLUMNS gives the room, and the classic style has no progress column, so lines are not padded to that width.
      - run: python -m pytest -v -o console_output_style=classic --junitxml=report.xml tests/
        env:
          COLUMNS: "4096"
      # P67: pytest exits 0 when a test ends its process early (os._exit(0)); the report holds every collected test.
      - run: python -I tests/report_check.py report.xml tests/
  test-mac:
    # Rule 17: a pull request runs ONE Mac job, the floor's Python (G21.15); main and release-* run every Python.
    # macos-26 is what macos-latest was when 3.9 first passed there (2026-11-23).
    name: test (macos-26, ${{ matrix.python }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.9"]' || '["3.9", "3.10", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      # G20.6 (plan 1.22): -v gives every test its own line with its outcome and a skip's reason, so the log shows
      # each test ran. Never with -q (it cancels -v); -rA is not enough (it folds skips into one line without names).
      # pytest drops a skip's reason that does not fit the terminal (80 columns on CI, and some test IDs are long):
      # COLUMNS gives the room, and the classic style has no progress column, so lines are not padded to that width.
      - run: python -m pytest -v -o console_output_style=classic --junitxml=report.xml tests/
        env:
          COLUMNS: "4096"
      # P67: pytest exits 0 when a test ends its process early (os._exit(0)); the report holds every collected test.
      - run: python -I tests/report_check.py report.xml tests/
  skills:
    # G9.5: the skill format gate (check C15). A gh without `skill` gets the pinned release.
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PINNED: "2.104.0"
    steps:
      - uses: actions/checkout@v4
      - name: gh with the skill command
        run: |
          gh --version
          if ! gh skill --help >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            base="https://github.com/cli/cli/releases/download/v${GH_PINNED}"
            curl -fsSLO "$base/gh_${GH_PINNED}_linux_amd64.tar.gz"
            curl -fsSLO "$base/gh_${GH_PINNED}_checksums.txt"
            grep " gh_${GH_PINNED}_linux_amd64.tar.gz\$" "gh_${GH_PINNED}_checksums.txt" | sha256sum -c -
            tar -xzf "gh_${GH_PINNED}_linux_amd64.tar.gz"
            echo "$RUNNER_TEMP/gh_${GH_PINNED}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi
      - name: gh skill publish --dry-run
        run: |
          gh --version
          gh skill publish --dry-run
